<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#241914">

<title>Morrow — Coffee & Reading Room</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">

<style>

/* =========================================================
   01. VARIABLES / RESET
========================================================= */

:root {
    --espresso: #30211b;
    --dark-roast: #18110e;
    --roast: #4b342a;
    --coffee: #684837;
    --caramel: #bd8b63;
    --cream: #f3ebdf;
    --oat: #dfd0bc;
    --paper: #faf5ed;
    --white: #fffaf3;
    --muted: #817269;
    --line: rgba(48,33,27,.14);
    --dark-line: rgba(255,255,255,.13);
    --green: #445448;

    --serif: "DM Serif Display", serif;
    --sans: "DM Sans", sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--cream);
    color: var(--espresso);
    font-family: var(--sans);
    overflow-x: hidden;
}

body.lock {
    overflow: hidden;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    cursor: not-allowed;
    opacity: .45;
}

a {
    color: inherit;
    text-decoration: none;
}

img {
    display: block;
    width: 100%;
}

h1,
h2,
h3,
h4 {
    font-family: var(--serif);
    font-weight: 400;
}

section {
    padding: 110px 6.5%;
}

.eyebrow {
    margin-bottom: 14px;
    color: var(--caramel);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.7px;
    text-transform: uppercase;
}

.display-title {
    font-family: var(--serif);
    font-size: clamp(47px, 6.2vw, 90px);
    font-weight: 400;
    line-height: .94;
    letter-spacing: -2px;
}

.body-copy {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.85;
}

.pill-button {
    padding: 13px 20px;
    border: 1px solid currentColor;
    border-radius: 999px;
    background: transparent;
    color: inherit;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    transition: .25s ease;
}

.pill-button:hover {
    transform: translateY(-2px);
}

.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
}


/* =========================================================
   02. LOADER
========================================================= */

.loader {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: grid;
    place-items: center;
    background: var(--cream);
    transition: opacity .65s, visibility .65s;
}

.loader.hide {
    opacity: 0;
    visibility: hidden;
}

.loader-inner {
    text-align: center;
}

.loader-cup {
    position: relative;
    width: 88px;
    height: 60px;
    margin: 35px auto 22px;
    border: 4px solid var(--espresso);
    border-radius: 5px 5px 28px 28px;
}

.loader-cup::after {
    content: "";
    position: absolute;
    width: 28px;
    height: 31px;
    top: 9px;
    right: -29px;
    border: 4px solid var(--espresso);
    border-left: 0;
    border-radius: 0 20px 20px 0;
}

.loader-coffee {
    position: absolute;
    left: 4px;
    right: 4px;
    bottom: 4px;
    height: 0;
    background: var(--coffee);
    border-radius: 3px 3px 20px 20px;
    animation: coffeeFill 1.8s forwards;
}

.steam {
    position: absolute;
    top: -38px;
    width: 2px;
    height: 28px;
    background: var(--caramel);
    opacity: 0;
    animation: steamRise 1.5s infinite ease;
}

.steam:nth-child(1) { left: 22px; }
.steam:nth-child(2) { left: 42px; animation-delay: .35s; }
.steam:nth-child(3) { left: 61px; animation-delay: .7s; }

.loader p {
    font-family: var(--serif);
    font-size: 20px;
}

@keyframes coffeeFill {
    to { height: 47px; }
}

@keyframes steamRise {
    0% { opacity: 0; transform: translateY(9px); }
    50% { opacity: .55; }
    100% { opacity: 0; transform: translateY(-15px); }
}


/* =========================================================
   03. NAVIGATION
========================================================= */

.navbar {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
    width: 100%;
    padding: 21px 5%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    color: var(--white);
    transition: .3s ease;
}

.navbar.scrolled {
    padding-top: 14px;
    padding-bottom: 14px;
    background: rgba(24,17,14,.95);
    backdrop-filter: blur(15px);
}

.nav-left,
.nav-right {
    display: flex;
    align-items: center;
    gap: 24px;
}

.nav-right {
    justify-content: flex-end;
}

.nav-link {
    border: 0;
    background: none;
    color: inherit;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    opacity: .82;
}

.nav-link:hover {
    opacity: 1;
}

.brand {
    font-family: var(--serif);
    font-size: 30px;
    line-height: 1;
}

.nav-cart {
    padding: 10px 15px;
    border: 1px solid rgba(255,255,255,.5);
    border-radius: 999px;
    background: transparent;
    color: var(--white);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
}

.cart-badge {
    display: inline-grid;
    place-items: center;
    min-width: 19px;
    height: 19px;
    margin-left: 6px;
    padding: 0 5px;
    border-radius: 20px;
    background: var(--cream);
    color: var(--espresso);
    font-size: 9px;
}

.mobile-toggle {
    display: none;
    width: 38px;
    height: 38px;
    border: 1px solid rgba(255,255,255,.45);
    border-radius: 50%;
    background: transparent;
    color: var(--white);
}


/* =========================================================
   04. MOBILE MENU
========================================================= */

.mobile-menu {
    position: fixed;
    inset: 0;
    z-index: 1500;
    padding: 30px;
    display: flex;
    flex-direction: column;
    background: var(--dark-roast);
    color: var(--cream);
    transform: translateX(100%);
    transition: .4s ease;
}

.mobile-menu.show {
    transform: translateX(0);
}

.mobile-menu-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.mobile-menu-links {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
}

.mobile-menu-links a {
    font-family: var(--serif);
    font-size: clamp(40px, 12vw, 70px);
    line-height: 1;
}

.round-close {
    width: 40px;
    height: 40px;
    border: 1px solid currentColor;
    border-radius: 50%;
    background: transparent;
    color: inherit;
    font-size: 21px;
}


/* =========================================================
   05. HERO
========================================================= */

.hero {
    position: relative;
    min-height: 100vh;
    padding: 140px 6.5% 65px;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
    color: var(--white);
    background:
        linear-gradient(
            90deg,
            rgba(18,11,8,.85),
            rgba(18,11,8,.45),
            rgba(18,11,8,.12)
        ),
        url("https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=1900&q=88")
        center / cover no-repeat;
}

.hero-content {
    position: relative;
    z-index: 5;
    width: 100%;
}

.hero-kicker {
    margin-bottom: 23px;
    color: #dfc0a0;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.hero h1 {
    max-width: 1100px;
    font-size: clamp(74px, 11vw, 160px);
    line-height: .76;
    letter-spacing: -6px;
}

.hero h1 span {
    color: #dbb894;
}

.hero-bottom {
    margin-top: 45px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 40px;
}

.hero-copy {
    max-width: 440px;
    color: rgba(255,255,255,.72);
    font-size: 14px;
    line-height: 1.8;
}

.hero-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.hero-primary,
.hero-secondary {
    padding: 14px 21px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.1px;
    text-transform: uppercase;
}

.hero-primary {
    border: 1px solid var(--cream);
    background: var(--cream);
    color: var(--espresso);
}

.hero-secondary {
    border: 1px solid rgba(255,255,255,.6);
    background: transparent;
    color: var(--white);
}


/* Coffee beans */

.bean {
    position: absolute;
    z-index: 2;
    width: 58px;
    height: 80px;
    border-radius: 50%;
    background:
        radial-gradient(circle at 30% 25%, #a87959, #543426 48%, #1c0f0a 82%);
    box-shadow: 10px 18px 30px rgba(0,0,0,.35);
    animation: beanFloat 7s ease-in-out infinite;
}

.bean::after {
    content: "";
    position: absolute;
    top: 10%;
    left: 49%;
    width: 3px;
    height: 80%;
    border-radius: 50%;
    background: rgba(14,7,4,.7);
    transform: rotate(7deg);
}

.bean-1 { right: 11%; top: 21%; }
.bean-2 { right: 27%; top: 53%; transform: scale(.55) rotate(35deg); animation-delay: 1s; }
.bean-3 { right: 7%; bottom: 8%; transform: scale(1.1) rotate(-25deg); animation-delay: 2s; }

@keyframes beanFloat {
    0%,100% { translate: 0 0; rotate: 0deg; }
    50% { translate: 0 -22px; rotate: 10deg; }
}


/* =========================================================
   06. MARQUEE
========================================================= */

.marquee {
    overflow: hidden;
    padding: 17px 0;
    background: var(--espresso);
    color: var(--cream);
    white-space: nowrap;
}

.marquee-track {
    width: max-content;
    animation: marqueeMove 28s linear infinite;
}

.marquee span {
    margin-right: 42px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2.1px;
    text-transform: uppercase;
}

.marquee b {
    margin-right: 42px;
    color: var(--caramel);
}

@keyframes marqueeMove {
    to { transform: translateX(-50%); }
}


/* =========================================================
   07. INTRO
========================================================= */

.intro {
    display: grid;
    grid-template-columns: .8fr 1.2fr;
    gap: 10%;
    align-items: start;
}

.intro-copy {
    max-width: 650px;
    padding-top: 12px;
}

.intro-copy p + p {
    margin-top: 20px;
}

.intro-quote {
    margin-top: 32px !important;
    color: var(--espresso) !important;
    font-family: var(--serif);
    font-size: 27px !important;
    line-height: 1.25 !important;
}


/* =========================================================
   08. MENU
========================================================= */

.menu-section {
    background: var(--dark-roast);
    color: var(--cream);
}

.menu-heading {
    margin-bottom: 45px;
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 35px;
}

.menu-heading-copy {
    max-width: 420px;
    color: #a4958d;
    font-size: 13px;
    line-height: 1.8;
}

.menu-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 27px;
}

.menu-tab {
    padding: 11px 18px;
    border: 1px solid #51433d;
    border-radius: 999px;
    background: transparent;
    color: #b7a8a0;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .5px;
}

.menu-tab.active,
.menu-tab:hover {
    border-color: var(--cream);
    background: var(--cream);
    color: var(--espresso);
}

.menu-description {
    max-width: 680px;
    min-height: 45px;
    margin-bottom: 30px;
    color: #8f817a;
    font-size: 12px;
    line-height: 1.7;
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 13px;
}

.product-card {
    position: relative;
    min-height: 270px;
    padding: 27px;
    display: flex;
    flex-direction: column;
    border: 1px solid #40342f;
    border-radius: 10px;
    transition: .3s ease;
}

.product-card:hover {
    transform: translateY(-5px);
    border-color: #765a4c;
    background: #211916;
}

.product-category {
    color: var(--caramel);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.product-price {
    position: absolute;
    top: 27px;
    right: 25px;
    color: #d5a77f;
    font-size: 12px;
    font-weight: 600;
}

.product-card h3 {
    max-width: 80%;
    margin-top: 15px;
    font-size: 29px;
    line-height: 1.02;
}

.product-card > p {
    margin-top: 13px;
    color: #92837b;
    font-size: 11px;
    line-height: 1.65;
}

.product-actions {
    margin-top: auto;
    padding-top: 24px;
    display: flex;
    gap: 9px;
}

.product-actions button {
    padding: 10px 13px;
    border-radius: 999px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .7px;
    text-transform: uppercase;
}

.customize-btn {
    border: 1px solid #5e4c44;
    background: transparent;
    color: var(--cream);
}

.quick-add {
    border: 1px solid var(--cream);
    background: var(--cream);
    color: var(--espresso);
}


/* =========================================================
   09. COFFEE STORY
========================================================= */

.coffee-story {
    padding: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--oat);
}

.coffee-photo {
    min-height: 720px;
    background:
        linear-gradient(rgba(20,12,8,.05),rgba(20,12,8,.05)),
        url("https://images.unsplash.com/photo-1442512595331-e89e73853f31?auto=format&fit=crop&w=1300&q=88")
        center / cover;
}

.coffee-copy {
    padding: 100px 10%;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.coffee-copy .body-copy {
    max-width: 570px;
    margin-top: 28px;
}

.coffee-notes {
    margin-top: 42px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 17px;
}

.coffee-note {
    padding-top: 17px;
    border-top: 1px solid rgba(48,33,27,.22);
}

.coffee-note strong {
    display: block;
    font-size: 9px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.coffee-note span {
    display: block;
    margin-top: 8px;
    color: var(--muted);
    font-size: 11px;
}


/* =========================================================
   10. READING ROOM
========================================================= */

.reading-room {
    min-height: 680px;
    display: flex;
    align-items: center;
    color: var(--white);
    background:
        linear-gradient(90deg,rgba(18,12,9,.84),rgba(18,12,9,.35)),
        url("https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=1800&q=88")
        center / cover;
}

.reading-copy {
    max-width: 700px;
}

.reading-copy .body-copy {
    max-width: 520px;
    margin-top: 27px;
    color: rgba(255,255,255,.72);
}

.reading-features {
    margin-top: 35px;
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
}

.reading-features span {
    padding: 10px 14px;
    border: 1px solid rgba(255,255,255,.32);
    border-radius: 999px;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}


/* =========================================================
   11. PEOPLE HERE — KEPT AS REQUESTED
========================================================= */

.people {
    background: var(--cream);
}

.people-heading {
    margin-bottom: 55px;
    text-align: center;
}

.people-grid {
    max-width: 1350px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(5,1fr);
    gap: 15px;
}

.person {
    padding: 35px 22px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--white);
    text-align: center;
    transition: .3s ease;
}

.person:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 50px rgba(48,33,27,.07);
}

.avatar {
    width: 78px;
    height: 78px;
    margin: 0 auto 20px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--espresso);
    color: var(--cream);
    font-family: var(--serif);
    font-size: 30px;
}

.person h3 {
    font-size: 27px;
}

.person-role {
    display: block;
    margin: 6px 0 15px;
    color: var(--caramel);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

.person p {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.7;
}


/* =========================================================
   12. QUIET CORNER
========================================================= */

.corner {
    background: var(--espresso);
    color: var(--cream);
}

.corner-heading {
    max-width: 780px;
    margin: 0 auto 55px;
    text-align: center;
}

.corner-heading p {
    max-width: 590px;
    margin: 20px auto 0;
    color: rgba(243,235,223,.58);
    font-size: 12px;
    line-height: 1.8;
}

.mood-grid {
    max-width: 1150px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 13px;
}

.mood-card {
    min-height: 230px;
    padding: 27px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 1px solid rgba(243,235,223,.18);
    border-radius: 10px;
    background: transparent;
    color: var(--cream);
    text-align: left;
    transition: .3s;
}

.mood-card:hover {
    transform: translateY(-6px);
    background: var(--cream);
    color: var(--espresso);
}

.mood-icon {
    font-size: 24px;
}

.mood-card strong {
    display: block;
    margin-bottom: 7px;
    font-family: var(--serif);
    font-size: 25px;
    font-weight: 400;
}

.mood-card small {
    color: rgba(243,235,223,.52);
    line-height: 1.5;
}

.mood-card:hover small {
    color: var(--muted);
}

.corner-result {
    display: none;
    max-width: 1050px;
    margin: auto;
    text-align: center;
}

.corner-result.show {
    display: block;
    animation: riseIn .45s ease;
}

@keyframes riseIn {
    from { opacity: 0; transform: translateY(20px); }
}

.corner-result > h2 {
    margin-bottom: 40px;
    font-size: clamp(45px,6vw,76px);
}

.result-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    border: 1px solid rgba(243,235,223,.17);
    border-radius: 12px;
    overflow: hidden;
    text-align: left;
}

.result-card {
    min-height: 190px;
    padding: 27px;
    border-right: 1px solid rgba(243,235,223,.15);
}

.result-card:last-child {
    border-right: 0;
}

.result-card span {
    display: block;
    margin-bottom: 18px;
    color: var(--caramel);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1.7px;
    text-transform: uppercase;
}

.result-card h3 {
    font-size: 24px;
}

.result-card p {
    margin-top: 8px;
    color: rgba(243,235,223,.5);
    font-size: 10px;
    line-height: 1.6;
}

.corner-quote {
    max-width: 700px;
    margin: 35px auto;
    font-family: var(--serif);
    font-size: 27px;
    line-height: 1.3;
}


/* =========================================================
   13. VISIT
========================================================= */

.visit {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9%;
    background: var(--oat);
}

.visit-copy .body-copy {
    max-width: 480px;
    margin-top: 25px;
}

.visit-details {
    display: grid;
}

.visit-row {
    padding: 20px 0;
    border-bottom: 1px solid rgba(48,33,27,.18);
}

.visit-row:first-child {
    padding-top: 0;
}

.visit-row span {
    display: block;
    margin-bottom: 7px;
    color: var(--caramel);
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
}

.visit-row strong {
    font-family: var(--serif);
    font-size: 25px;
    font-weight: 400;
}


/* =========================================================
   14. FOOTER
===========================================
